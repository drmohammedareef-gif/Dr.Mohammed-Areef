<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Subtle radial depth for the black background -->
    <radialGradient id="amCarsBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1c1c1f" />
      <stop offset="70%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <!-- Crisp white highlights -->
    <linearGradient id="silverRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a1a1aa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- 1. Original Black Circular Background -->
  <circle cx="120" cy="120" r="116" fill="url(#amCarsBg)" stroke="url(#silverRing)" stroke-width="3" />
  
  <!-- Inner circular accent border -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35" />
  <circle cx="120" cy="120" r="106" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 3" stroke-opacity="0.25" />

  <!-- 2. White Car & Key Icon Emblem -->
  <g transform="translate(120, 78)">
    <!-- Car Key Fob & Ring element behind/above car -->
    <path 
      d="M -14 -42 C -14 -48, 14 -48, 14 -42 L 12 -28 C 12 -25, -12 -25, -12 -28 Z" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="2.5" 
      stroke-linejoin="round"
    />
    <!-- Key ring loop -->
    <circle cx="0" cy="-45" r="5" fill="none" stroke="#ffffff" stroke-width="2" />
    <!-- Key blade / shaft notch line -->
    <line x1="0" y1="-40" x2="0" y2="-28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Sleek Modern Car Silhouette in Pure White -->
    <!-- Car Body -->
    <path 
      d="M -54 6 
         C -54 6, -50 -6, -42 -8 
         L -26 -9 
         C -18 -24, -10 -26, 6 -26 
         L 24 -26 
         C 34 -26, 42 -14, 48 -7 
         L 55 -3 
         C 58 0, 60 4, 60 8 
         L 58 13 
         C 57 15, 54 16, 50 16 
         L 46 16 
         C 46 9, 39 3, 31 3 
         C 23 3, 16 9, 16 16 
         L -20 16 
         C -20 9, -27 3, -35 3 
         C -43 3, -50 9, -50 16 
         L -53 16 
         C -56 16, -58 14, -58 11 
         Z" 
      fill="#ffffff" 
    />

    <!-- Cabin Glass / Windows (cutout in black) -->
    <path 
      d="M -22 -8 
         L -7 -8 
         L -7 -21 
         C -13 -21, -18 -18, -22 -8 Z" 
      fill="#09090b" 
    />
    <path 
      d="M -3 -8 
         L 24 -8 
         C 29 -8, 36 -14, 38 -20 
         L 6 -21 
         C 2 -21, -3 -15, -3 -8 Z" 
      fill="#09090b" 
    />

    <!-- Headlight & Taillight accents -->
    <polygon points="53,-1 59,4 53,6" fill="#ffffff" />
    <line x1="-54" y1="8" x2="-49" y2="8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Front & Rear Wheels -->
    <circle cx="-35" cy="16" r="8.5" fill="#09090b" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="-35" cy="16" r="3.5" fill="#ffffff" />

    <circle cx="31" cy="16" r="8.5" fill="#09090b" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="31" cy="16" r="3.5" fill="#ffffff" />

    <!-- Car Key Remote Emblem / Lock-Unlock Accent beneath vehicle -->
    <g transform="translate(0, 28)">
      <!-- Sleek horizontal key blade & remote bar -->
      <path 
        d="M -32 0 L 32 0" 
        stroke="#ffffff" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-opacity="0.8"
      />
      <!-- Key teeth accents on right side -->
      <line x1="22" y1="0" x2="22" y2="4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <line x1="28" y1="0" x2="28" y2="3" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      
      <!-- Key fob loop / head on left side -->
      <rect x="-38" y="-4" width="8" height="8" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="-34" cy="0" r="1.5" fill="#ffffff" />
    </g>
  </g>

  <!-- 3. "AM CARS AMBAI" Text -->
  <!-- "AM CARS" - Bold display uppercase -->
  <text 
    x="120" 
    y="160" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif" 
    font-size="25" 
    font-weight="900" 
    letter-spacing="2.5"
  >
    AM CARS
  </text>

  <!-- Decorative Separator Stars & Line -->
  <g transform="translate(120, 175)">
    <line x1="-58" y1="0" x2="-26" y2="0" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5" />
    <!-- Small star/diamond -->
    <path d="M -20 0 L -18 -3 L -16 0 L -18 3 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
    <path d="M 16 0 L 18 -3 L 20 0 L 18 3 Z" fill="#ffffff" />
    <line x1="26" y1="0" x2="58" y2="0" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5" />
  </g>

  <!-- "AMBAI" - Clean letterspaced secondary branding -->
  <text 
    x="120" 
    y="198" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif" 
    font-size="16" 
    font-weight="700" 
    letter-spacing="6"
  >
    AMBAI
  </text>
</svg>
